name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod # no go.sum in this repo; key cache on go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...
  test-race:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 1 # race detector requires cgo; be explicit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.mod # no go.sum in this repo; key cache on go.mod
      - run: go test -race -count=1 ./...
  timing:
    name: ci wall-time
    runs-on: ubuntu-latest
    needs: [test, test-race]
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: report total CI wall time
        continue-on-error: true # observability only; never fail CI over the clock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          start_iso=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          start_s=$(date -u -d "$start_iso" +%s)
          elapsed=$(( $(date -u +%s) - start_s ))
          echo "total CI wall time: $(( elapsed / 60 ))m$(( elapsed % 60 ))s (run started $start_iso)"
